<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول - دليل خدمات الإسكندرية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: white; border-radius: 30px; padding: 40px; max-width: 450px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e293b; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; font-family: 'Cairo', sans-serif; }
        input:focus { outline: none; border-color: #3b82f6; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .alert { padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert-error { background: #fee2e2; color: #dc2626; }
        .alert-success { background: #dcfce7; color: #16a34a; }
        .register-link { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .register-link a { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .demo-accounts { margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 12px; }
        .demo-accounts p { color: #64748b; font-size: 14px; margin-bottom: 10px; }
        .demo-item { padding: 8px; margin: 5px 0; background: white; border-radius: 8px; cursor: pointer; }
        .demo-item:hover { background: #e2e8f0; }
        .loading { display: none; text-align: center; margin-top: 15px; }
        .loading.show { display: block; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🔐 مرحباً بك</h1>
        <p class="subtitle">سجل دخولك إلى حسابك</p>
        <div id="alertMessage" class="alert"></div>
        <form id="loginForm">
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email" placeholder="example@email.com"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" id="password" placeholder="••••••••"></div>
            <button type="submit" id="submitBtn">دخول</button>
            <div class="loading" id="loading"><div class="spinner"></div><p>جاري تسجيل الدخول...</p></div>
        </form>
        <div class="demo-accounts">
            <p>📋 حسابات تجريبية:</p>
            <div class="demo-item" onclick="fillDemo('ahmed@example.com', '123456')">👨‍🔧 أحمد محمد - ahmed@example.com</div>
            <div class="demo-item" onclick="fillDemo('mohamed@example.com', '123456')">👨‍🔧 محمد علي - mohamed@example.com</div>
            <div class="demo-item" onclick="fillDemo('khaled@example.com', '123456')">👨‍🔧 خالد حسن - khaled@example.com</div>
        </div>
        <div class="register-link">ليس لديك حساب؟ <a href="register.html">سجل الآن</a></div>
    </div>
    <script>
        const SUPABASE_URL = 'https://gztqvuwxhjiwaxttzhtk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dHF2dXd4aGppd2F4dHR6aHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDAxOTksImV4cCI6MjA5NTU3NjE5OX0.Pt7inMLxyyLFavqtgSHPQbpt4FRYK6TV5IUntoyLzT0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type} show`;
            alertDiv.textContent = message;
            setTimeout(() => alertDiv.classList.remove('show'), 4000);
        }
        
        function fillDemo(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            showAlert('تم تعبئة بيانات الحساب التجريبي، اضغط دخول', 'success');
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) { showAlert('الرجاء إدخال البريد الإلكتروني وكلمة المرور', 'error'); return; }
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            submitBtn.disabled = true;
            loading.classList.add('show');
            
            try {
                const { data: technician, error } = await supabaseClient.from('technicians').select('id, full_name, email, password').eq('email', email).single();
                if (error || !technician) { showAlert('البريد الإلكتروني غير موجود', 'error'); submitBtn.disabled = false; loading.classList.remove('show'); return; }
                if (technician.password !== password) { showAlert('كلمة المرور غير صحيحة', 'error'); submitBtn.disabled = false; loading.classList.remove('show'); return; }
                
                localStorage.setItem('currentUser', JSON.stringify({ id: technician.id, email: technician.email, fullName: technician.full_name, role: 'technician' }));
                showAlert('✅ تم تسجيل الدخول بنجاح! جاري التحويل...', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } catch (error) { showAlert('حدث خطأ في تسجيل الدخول', 'error'); submitBtn.disabled = false; loading.classList.remove('show'); }
        });
    </script>
</body>
</html>
