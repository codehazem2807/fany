<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - دليل خدمات جميع المحافظات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #0f2b3d;
            --secondary: #00b4d8;
            --accent: #f4a261;
            --success: #2a9d8f;
            --danger: #e76f51;
            --gradient: linear-gradient(135deg, #0f2b3d 0%, #1b4a6e 100%);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #f5f7fb; }
        
        .header { background: var(--gradient); padding: 1rem 0; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 30px; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo a { color: white; text-decoration: none; font-size: 1.5rem; font-weight: 800; }
        .logo span { color: var(--accent); }
        .nav-menu { display: flex; gap: 2rem; list-style: none; align-items: center; }
        .nav-menu a { color: white; text-decoration: none; font-weight: 600; }
        .logout-btn { background: #ef4444; border: none; padding: 8px 20px; border-radius: 10px; color: white; cursor: pointer; }
        
        .dashboard-container { max-width: 1280px; margin: 30px auto; padding: 0 30px; }
        
        .welcome-card { background: var(--gradient); color: white; padding: 40px; border-radius: 30px; margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; text-align: center; box-shadow: var(--shadow-md); }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--primary); }
        .stat-label { color: #64748b; margin-top: 5px; }
        
        .profile-card { background: white; padding: 30px; border-radius: 25px; margin-bottom: 30px; }
        .reviews-card { background: white; padding: 30px; border-radius: 25px; margin-bottom: 30px; }
        
        h2 { color: var(--primary); margin-bottom: 20px; border-right: 4px solid var(--secondary); padding-right: 15px; }
        
        .avatar-section { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; padding-bottom: 25px; border-bottom: 2px dashed #e2e8f0; }
        .current-avatar { width: 120px; height: 120px; background: var(--gradient); border-radius: 60px; display: flex; align-items: center; justify-content: center; font-size: 3rem; overflow: hidden; }
        .current-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-btn { padding: 12px 24px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .avatar-upload-btn { background: var(--secondary); color: white; }
        .avatar-remove-btn { background: var(--danger); color: white; }
        
        .info-row { display: flex; padding: 12px 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
        .info-label { width: 150px; font-weight: 600; color: var(--primary); }
        .info-value { flex: 1; color: #64748b; }
        
        .review-item { padding: 15px; border-bottom: 1px solid #e2e8f0; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .review-stars { color: var(--accent); }
        
        .upload-progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: #e2e8f0; z-index: 3000; display: none; }
        .upload-progress-bar { width: 0%; height: 100%; background: var(--success); transition: width 0.3s; }
        
        .toast-message { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 12px 24px; border-radius: 50px; z-index: 2000; opacity: 0; transition: opacity 0.3s; }
        .toast-message.show { opacity: 1; }
        .toast-message.error { background: var(--danger); }
        
        .loading { text-align: center; padding: 50px; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top: 4px solid var(--secondary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .footer { background: #0f172a; color: white; padding: 2rem 0; margin-top: 4rem; text-align: center; }
        
        @media (max-width: 768px) {
            .info-row { flex-direction: column; }
            .info-label { width: 100%; margin-bottom: 5px; }
            .avatar-section { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div id="toastMessage" class="toast-message"></div>
    <div class="upload-progress" id="uploadProgress"><div class="upload-progress-bar" id="uploadProgressBar"></div></div>
    
    <header class="header">
        <div class="container">
            <div class="nav-content">
                <div class="logo"><a href="index.html">🛠️ دليل خدمات <span>جميع المحافظات</span></a></div>
                <ul class="nav-menu">
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="technicians.html">الفنيين</a></li>
                    <li><button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</button></li>
                </ul>
            </div>
        </div>
    </header>
    
    <div class="dashboard-container" id="dashboardContent"><div class="loading"><div class="spinner"></div><p>جاري التحميل...</p></div></div>
    
    <footer class="footer">
        <div class="container">
            <p>&copy; Hazem Mohamady 2026 دليل خدمات جميع المحافظات - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://gztqvuwxhjiwaxttzhtk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6dHF2dXd4aGppd2F4dHR6aHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDAxOTksImV4cCI6MjA5NTU3NjE5OX0.Pt7inMLxyyLFavqtgSHPQbpt4FRYK6TV5IUntoyLzT0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentTechnician = null;
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = message;
            toast.className = `toast-message ${isError ? 'error' : ''}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        async function uploadAvatar(file) {
            if (!file) return false;
            
            if (!file.type.startsWith('image/')) {
                showToast('❌ الرجاء اختيار ملف صورة', true);
                return false;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                showToast('❌ حجم الصورة يجب أن لا يتجاوز 5 ميجابايت', true);
                return false;
            }
            
            const progressBar = document.getElementById('uploadProgressBar');
            const progressDiv = document.getElementById('uploadProgress');
            
            progressDiv.style.display = 'block';
            progressBar.style.width = '30%';
            
            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `${currentTechnician.id}-${Date.now()}.${fileExt}`;
                const filePath = `${fileName}`;
                
                progressBar.style.width = '60%';
                
                // رفع الملف مباشرة إلى Supabase Storage
                const { data, error } = await supabaseClient.storage
                    .from('technician-avatars')
                    .upload(filePath, file, {
                        cacheControl: '3600',
                        upsert: true
                    });
                
                if (error) {
                    console.error('Upload error:', error);
                    throw new Error(error.message);
                }
                
                progressBar.style.width = '80%';
                
                // الحصول على الرابط العام
                const { data: { publicUrl } } = supabaseClient.storage
                    .from('technician-avatars')
                    .getPublicUrl(filePath);
                
                // تحديث قاعدة البيانات
                const { error: updateError } = await supabaseClient
                    .from('technicians')
                    .update({ avatar_url: publicUrl })
                    .eq('id', currentTechnician.id);
                
                if (updateError) {
                    throw new Error(updateError.message);
                }
                
                progressBar.style.width = '100%';
                
                setTimeout(() => {
                    progressDiv.style.display = 'none';
                    progressBar.style.width = '0%';
                }, 500);
                
                showToast('✅ تم تحديث الصورة الشخصية بنجاح!');
                return true;
                
            } catch (error) {
                console.error('Upload error:', error);
                progressDiv.style.display = 'none';
                progressBar.style.width = '0%';
                showToast('❌ خطأ في رفع الصورة: ' + error.message, true);
                return false;
            }
        }
        
        async function removeAvatar() {
            if (!confirm('هل أنت متأكد من إزالة الصورة الشخصية؟')) return;
            
            const { error } = await supabaseClient
                .from('technicians')
                .update({ avatar_url: null })
                .eq('id', currentTechnician.id);
            
            if (error) {
                showToast('❌ حدث خطأ في إزالة الصورة', true);
            } else {
                showToast('✅ تم إزالة الصورة بنجاح');
                setTimeout(() => loadDashboard(), 500);
            }
        }
        
        async function loadDashboard() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) { 
                window.location.href = 'login.html'; 
                return; 
            }
            
            const { data: tech, error } = await supabaseClient
                .from('technicians')
                .select(`*, categories:category_id (name), areas:area_id (name)`)
                .eq('id', currentUser.id)
                .single();
            
            if (error || !tech) { 
                logout(); 
                return; 
            }
            
            currentTechnician = tech;
            
            const { data: reviews } = await supabaseClient
                .from('reviews')
                .select('*')
                .eq('technician_id', tech.id)
                .order('created_at', { ascending: false });
            
            const avatarHtml = tech.avatar_url ? `<img src="${tech.avatar_url}" alt="${tech.full_name}">` : '<i class="fas fa-user-cog"></i>';
            
            document.getElementById('dashboardContent').innerHTML = `
                <div class="welcome-card">
                    <h1><i class="fas fa-hand-wave"></i> مرحباً ${tech.full_name}</h1>
                    <p>مرحباً بك في لوحة تحكم فنيي دليل خدمات جميع المحافظات</p>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-number">${tech.total_reviews || 0}</div><div class="stat-label">تقييمات</div></div>
                    <div class="stat-card"><div class="stat-number">${tech.average_rating || 0}</div><div class="stat-label">التقييم العام</div></div>
                    <div class="stat-card"><div class="stat-number">${tech.views_count || 0}</div><div class="stat-label">مشاهدات</div></div>
                </div>
                
                <div class="profile-card">
                    <h2><i class="fas fa-user-circle"></i> ملفي الشخصي</h2>
                    
                    <div class="avatar-section">
                        <div class="current-avatar">${avatarHtml}</div>
                        <div>
                            <button class="avatar-btn avatar-upload-btn" id="uploadAvatarBtn"><i class="fas fa-camera"></i> رفع صورة شخصية</button>
                            <button class="avatar-btn avatar-remove-btn" id="removeAvatarBtn" style="margin-top:10px;"><i class="fas fa-trash"></i> إزالة الصورة</button>
                        </div>
                    </div>
                    
                    <div class="info-row"><div class="info-label">الاسم:</div><div class="info-value">${tech.full_name}</div></div>
                    <div class="info-row"><div class="info-label">البريد الإلكتروني:</div><div class="info-value">${tech.email}</div></div>
                    <div class="info-row"><div class="info-label">رقم الهاتف:</div><div class="info-value">${tech.phone}</div></div>
                    <div class="info-row"><div class="info-label">التخصص:</div><div class="info-value">${tech.categories?.name || 'غير محدد'}</div></div>
                    <div class="info-row"><div class="info-label">المنطقة:</div><div class="info-value">${tech.areas?.name || 'غير محدد'}</div></div>
                    ${tech.bio ? `<div class="info-row"><div class="info-label">نبذة عني:</div><div class="info-value">${tech.bio}</div></div>` : ''}
                </div>
                
                <div class="reviews-card">
                    <h2><i class="fas fa-star"></i> تقييمات العملاء</h2>
                    ${!reviews || reviews.length === 0 ? '<p style="text-align:center;padding:20px;">لا توجد تقييمات حتى الآن</p>' : reviews.map(r => `
                        <div class="review-item">
                            <div class="review-header">
                                <strong>${r.customer_name}</strong>
                                <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                                <span style="color:#94a3b8;font-size:12px;">${new Date(r.created_at).toLocaleDateString('ar-EG')}</span>
                            </div>
                            <p>${r.comment}</p>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('uploadAvatarBtn')?.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const success = await uploadAvatar(file);
                        if (success) setTimeout(() => loadDashboard(), 1500);
                    }
                };
                input.click();
            });
            
            document.getElementById('removeAvatarBtn')?.addEventListener('click', removeAvatar);
        }
        
        function logout() { 
            localStorage.removeItem('currentUser'); 
            window.location.href = 'index.html'; 
        }
        
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
